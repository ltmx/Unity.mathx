site_name: Unity.mathx
site_url: https://ltmx.github.io/Unity.mathx/
site_description: Extension library for Unity.Mathematics — fluent chains, noise, SDF, fast math, and Burst jobs.
site_author: LTMX
copyright: Copyright &copy; LTMX
repo_url: https://github.com/LTMX/Unity.mathx
repo_name: LTMX/Unity.mathx
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/branding/logo-128.png
  favicon: assets/branding/logo-128.png
  icon:
    logo: material/function-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LTMX/Unity.mathx
    - icon: fontawesome/brands/unity
      link: https://openupm.com/packages/com.ltmx.mathematics.mathx

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Fluent chains: guides/fluent-chains.md
      - Interpolation: guides/interpolation.md
      - Noise: guides/noise.md
      - Signed distance fields: guides/sdf.md
      - Fast math: guides/fast-math.md
      - Jobify & jobs: guides/jobify.md
      - Hashing: guides/hashing.md
      - Structs: guides/structs.md
  - API reference: ../api/index.html
  - Quality: QUALITY.md
  - Contributing: contributing.md
