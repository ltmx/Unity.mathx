{% extends "base.html" %}

{% block content %}
  {% if not page.is_homepage and page.meta.hide_banner is not true %}
  <div class="mathx-page-band">
    <img
      src="{{ 'assets/branding/banner-thin.png' | url }}"
      alt=""
      aria-hidden="true"
      loading="lazy"
    />
  </div>
  {% endif %}
  {{ super() }}
{% endblock %}

{% block extrahead %}
  {{ super() }}
  <meta property="og:image" content="{{ config.site_url }}assets/branding/banner.png">
  <meta property="og:image:alt" content="Unity.mathx — extension library for Unity.Mathematics">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}assets/branding/banner.png">
{% endblock %}
